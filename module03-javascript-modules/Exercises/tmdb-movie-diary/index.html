<!doctype html>
<html lang="en" class="h-full bg-gray-50">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Diary — Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-full text-gray-900">
    <!-- Navbar (FR008) -->
    <header class="bg-white border-b">
      <nav class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-6">
        <a href="index.html" class="font-semibold">Home</a>
        <a href="journal.html" class="hover:underline">Journal</a>
      </nav>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">
      <!-- Search (FR010) -->
      <form id="searchForm" class="flex gap-2">
        <input
          id="searchInput"
          class="flex-1 px-3 py-2 border rounded"
          placeholder="Search movies…" />
        <button class="px-4 py-2 rounded bg-indigo-600 text-white">Search</button>
      </form>

      <!-- Popular Movies (FR009 + FR011 + FR012) -->
      <section>
        <h1 class="text-2xl font-bold mb-3">Popular Movies</h1>
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      </section>
    </main>

    <!-- Search Results Dialog (FR010) -->
    <dialog id="searchDialog" class="rounded border p-0 w-full max-w-3xl">
      <div class="flex items-center justify-between border-b px-4 h-12">
        <h2 class="font-semibold">Search</h2>
        <form method="dialog"><button class="px-2 py-1 border rounded">Close</button></form>
      </div>
      <div id="searchResults" class="p-4"></div>
    </dialog>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
