<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokédex Diary — My Pokédex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="pokedex.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <!-- FR008: Navigation Bar - Navbar on both pages to switch between Homepage and Pokédex -->
    <header class="bg-slate-900 text-white">
      <nav class="mx-auto max-w-5xl flex items-center justify-between p-4">
        <a href="index.html" class="underline decoration-dashed">Home</a>
        <a href="pokedex.html" class="font-semibold">My Pokédex</a>
      </nav>
    </header>

    <main class="mx-auto max-w-5xl p-4 space-y-6">
      <h1 class="text-2xl font-bold">My Pokédex</h1>

      <!-- FR013: Pokédex Page Display - Empty state when no Pokémon caught -->
      <section id="empty" class="hidden rounded border border-slate-200 bg-white p-4">
        <p>You haven't caught any Pokémon yet.</p>
        <p class="text-sm text-slate-600">Go back to the Home page and click "Catch".</p>
      </section>

      <!-- FR013: Pokédex Page Display - Display caught Pokémon from localStorage -->
      <section id="dex" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>
    </main>
  </body>
</html>
